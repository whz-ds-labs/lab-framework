name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # plugin/test/skills.test.ts runs a Python helper through uv.
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: npm ci
      - run: npm run guard
      - run: npm run check:versions
      # Dist-dependent tests fail under CI when dist is missing, so build first.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint:css
      - run: npm test

  integration:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: npm ci
      - run: node scripts/integration.mjs --dir "$RUNNER_TEMP/demo-kurs"
