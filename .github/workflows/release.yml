name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The "Version Packages" PR is created with GITHUB_TOKEN and therefore triggers no
  # ci.yml run of its own, so the release re-runs all checks before publishing.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Trusted Publishing (OIDC) needs npm >= 11.5.1, shipped with Node 24.
      # If the first real run fails OIDC authentication because registry-url wrote an
      # .npmrc with an empty NODE_AUTH_TOKEN, fall back to removing registry-url (or set
      # NODE_AUTH_TOKEN: "" explicitly on the publish step). Task 20 verifies this on
      # the first release.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/publish.mjs
